[project]
name = "signal-asr-strategies"
version = "0.2.0"
description = "Cross-platform ASR strategy package for Signal Switchboard"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
cpu = [
    "sherpa-onnx==1.13.8",
    "sherpa-onnx-core==1.13.8",
    "huggingface-hub>=0.20.0",
]
server = [
    "fastapi>=0.110.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.27.0",
]
whisper = [
    # faster-whisper bundles CTranslate2; torch/transformers are not needed.
    "faster-whisper>=1.0.0",
    "huggingface-hub>=0.20.0",
]
# NeMo extras are unavailable until upstream permits patched Hydra/Lightning.
sherpa-onnx = [
    "sherpa-onnx==1.13.8",
    "sherpa-onnx-core==1.13.8",
    "huggingface-hub>=0.20.0",
    "onnxruntime-gpu>=1.18.0 ; sys_platform != 'darwin'",
]
macos = []
# A04: every extra that promises a cold-cache sherpa backend must also
# provide the downloader it imports (huggingface-hub).
linux = [
    "sherpa-onnx==1.13.8",
    "sherpa-onnx-core==1.13.8",
    "onnxruntime-gpu>=1.18.0",
    "huggingface-hub>=0.20.0",
]
wsl2 = [
    "sherpa-onnx==1.13.8",
    "sherpa-onnx-core==1.13.8",
    "onnxruntime-gpu>=1.18.0",
    "huggingface-hub>=0.20.0",
]
cuda = [
    "sherpa-onnx==1.13.8",
    "sherpa-onnx-core==1.13.8",
    "onnxruntime-gpu>=1.18.0 ; sys_platform != 'darwin'",
    "faster-whisper>=1.0.0",
    "huggingface-hub>=0.20.0",
]
all = [
    "sherpa-onnx==1.13.8",
    "sherpa-onnx-core==1.13.8",
    "onnxruntime-gpu>=1.18.0 ; sys_platform != 'darwin'",
    "faster-whisper>=1.0.0",
    "huggingface-hub>=0.20.0",
]
dev = [
    "httpx>=0.28.0",
    "pytest>=7.4.0",
    "fastapi>=0.110.0",
    "python-multipart>=0.0.9",
    "hypothesis>=6.100.0",
    "pytest-cov>=5.0.0",
    "ruff==0.15.14",
    "mypy==2.3.1",
    "types-requests>=2.31.0",
]

[project.scripts]
signal-asr-server = "signal_asr.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["signal_asr"]

[tool.hatch.build.targets.sdist]
include = [
    "signal_asr",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    ".github/workflows/ci.yml",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Explicit rule selection keeps behavior deterministic across ruff versions
# (0.16+ expanded default rules). Pinned in CI and mise.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PERF", "RUF"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
# Optional heavy backends are not importable in the unit-test environment.
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: downloads real models or needs docker; enable with SIGNAL_ASR_INTEGRATION=1",
]

[tool.coverage.run]
source = ["signal_asr"]
branch = true
# A16: no module-wide omits. macOS/Windows-only branches are covered by
# unit tests through injectable seams; real hardware paths run in the
# integration track.

[tool.coverage.report]
show_missing = true
exclude_also = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
