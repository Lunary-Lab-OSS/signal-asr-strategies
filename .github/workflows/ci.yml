name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          python-version: "3.12"
          version: "0.10.12"
      - name: ruff lint
        run: uvx ruff@0.15.14 check .
      - name: ruff format check
        run: uvx ruff@0.15.14 format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.10.12"
      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: sync locked environment
        run: uv sync --locked --extra dev --extra server
      - name: run tests with coverage
        run: >
          uv run --locked --extra dev --extra server pytest tests/ -q -m "not integration"
          --cov=signal_asr --cov-report=term-missing
          --cov-fail-under=85
      - name: coverage summary
        if: always()
        run: uv run --locked --extra dev --extra server coverage report | tail -5

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          python-version: "3.12"
          version: "0.10.12"
      - name: sync locked environment
        run: uv sync --locked --extra dev --extra server
      - name: mypy (blocking)
        run: uv run --locked --extra dev --extra server mypy signal_asr

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          python-version: "3.12"
          version: "0.10.12"
      - name: build wheel and sdist
        run: uv build
      - name: install wheel and import outside checkout
        run: |
          uv venv /tmp/wheel-check
          uv pip install --python /tmp/wheel-check/bin/python dist/*.whl
          cd /tmp
          /tmp/wheel-check/bin/python -I -c "import pathlib, sys, signal_asr; p = pathlib.Path(signal_asr.__file__).resolve(); assert p.is_relative_to(pathlib.Path(sys.prefix).resolve()), p; print(p, sorted(signal_asr.__all__))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  integration-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          python-version: "3.12"
          version: "0.10.12"
      - name: install ffmpeg and espeak-ng
        run: >
          sudo apt-get update && sudo apt-get install -y
          --no-install-recommends ffmpeg espeak-ng
      - name: sync locked environment
        run: uv sync --locked --extra dev --extra server --extra cpu
      - name: require speech and container prerequisites
        run: |
          command -v espeak-ng
          command -v ffmpeg
          docker info
          uv run --locked --extra dev --extra server --extra cpu python -c "import sherpa_onnx, fastapi, numpy"
      - name: docker build / start / transcribe
        run: >
          SIGNAL_ASR_INTEGRATION=1 uv run --locked --extra dev --extra server --extra cpu
          pytest tests/test_integration.py -q -k "docker or speech" --junitxml=integration.xml
      - name: reject skipped or missing speech tests
        run: >
          uv run --locked --extra dev --extra server --extra cpu python -I -c
          "import xml.etree.ElementTree as E; r=E.parse('integration.xml'); cases=r.findall('.//testcase'); assert len(cases)==3, len(cases); assert not r.findall('.//skipped'), 'Integration skips are failures'"

  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        profile: [core, server, cpu, whisper, sherpa-onnx, macos, linux, wsl2, cuda, all]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          python-version: "3.12"
          version: "0.10.12"
      - name: audit exported locked runtime profile
        run: |
          uv lock --check
          extras=()
          if [[ "${{ matrix.profile }}" != core ]]; then extras=(--extra "${{ matrix.profile }}"); fi
          uv export --locked --no-dev --no-emit-project --no-hashes "${extras[@]}" --output-file runtime-requirements.txt
          uvx pip-audit@2.9.0 --strict --disable-pip --no-deps --requirement runtime-requirements.txt
